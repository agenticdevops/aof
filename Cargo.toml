[workspace]
resolver = "2"
members = [
    "crates/agentix-core",
    "crates/agentix-mcp",
    "crates/agentix-llm",
    "crates/agentix-runtime",
    "crates/agentix-memory",
    "crates/agentix-triggers",
    "crates/agentix",
]

[workspace.package]
version = "2.0.0-alpha"
edition = "2021"
rust-version = "1.75"
license = "Apache-2.0"
repository = "https://github.com/openagentix/agentix"
authors = ["Gourav Shah <gjs@opsflow.sh>"]
keywords = ["ai", "agents", "llm", "automation", "enterprise"]
categories = ["command-line-utilities", "development-tools"]
homepage = "https://openagentix.org"
documentation = "https://docs.openagentix.org"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full"] }
async-trait = "0.1"
futures = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
serde_path_to_error = "0.1"

# HTTP/Networking
reqwest = { version = "0.11", features = ["json", "stream"] }
hyper = { version = "1.0", features = ["full"] }
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.6", features = ["fs", "trace", "cors"] }
axum = { version = "0.7", features = ["macros"] }
tokio-stream = { version = "0.1", features = ["sync"] }
http-body-util = "0.1"

# CLI
clap = { version = "4.4", features = ["derive", "cargo", "env"] }
clap_complete = "4.4"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Logging/Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Metrics
prometheus = "0.13"

# Performance
dashmap = "5.5"
arc-swap = "1.6"
parking_lot = "0.12"

# Zero-copy
bytes = "1.5"
memmap2 = "0.9"

# UUID
uuid = { version = "1.6", features = ["v4", "serde"] }

# Date/Time
chrono = { version = "0.4", features = ["serde"] }

# Random
rand = "0.8"

# Regex
regex = "1.10"

# Cryptography
sha2 = "0.10"

# Performance testing
criterion = { version = "0.5", features = ["html_reports"] }

# Test utilities
tempfile = "3.8"

# Internal workspace dependencies
agentix-core = { path = "crates/agentix-core", version = "2.0.0-alpha" }
agentix-mcp = { path = "crates/agentix-mcp", version = "2.0.0-alpha" }
agentix-llm = { path = "crates/agentix-llm", version = "2.0.0-alpha" }
agentix-runtime = { path = "crates/agentix-runtime", version = "2.0.0-alpha" }
agentix-memory = { path = "crates/agentix-memory", version = "2.0.0-alpha" }
agentix-triggers = { path = "crates/agentix-triggers", version = "2.0.0-alpha" }

# File utilities
glob = "0.3"
which = "6.0"

# Distributed locking and sandboxing
redis = { version = "0.25", features = ["aio", "tokio-comp"] }
bollard = "0.16"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[profile.bench]
inherits = "release"
