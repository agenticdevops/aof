[package]
name = "agentix-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Agent execution runtime for OpenAgentiX"
keywords.workspace = true
categories.workspace = true
homepage.workspace = true
documentation.workspace = true

[features]
## Enable WASM tool sandbox (adds wasmtime dependency; increases compile time)
wasm = ["dep:wasmtime"]

[dependencies]
agentix-core = { workspace = true }
## Optional: WASM sandbox runtime (enabled with feature = ["wasm"])
wasmtime = { version = "25", optional = true, default-features = false, features = ["runtime", "cranelift"] }
agentix-mcp = { workspace = true }
agentix-llm = { workspace = true }
agentix-memory = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
dashmap = { workspace = true }
arc-swap = { workspace = true }
parking_lot = { workspace = true }
futures = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
rand = { workspace = true }
regex = { workspace = true }
prometheus = { workspace = true }
axum = { workspace = true }
tower-http = { workspace = true }
tokio-stream = { workspace = true }
http-body-util = { workspace = true }
anyhow = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "full", "macros"] }
futures = { workspace = true }
tempfile = { workspace = true }
http-body-util = { workspace = true }
tower = { workspace = true }
## For WASM tests: compile WAT (WebAssembly Text Format) to bytes
wat = "1"
