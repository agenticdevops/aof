apiVersion: v1
kind: ConfigMap
metadata:
  name: aof-config
  namespace: aof-system
  labels:
    app.kubernetes.io/name: aof
    app.kubernetes.io/component: daemon
data:
  daemon.yaml: |
    apiVersion: aof.dev/v1
    kind: DaemonConfig
    metadata:
      name: aof-daemon
      labels:
        environment: production
        deployment: kubernetes

    spec:
      server:
        port: 8080
        host: 0.0.0.0
        cors: true
        timeout_secs: 30

      agents:
        directory: /app/agents
        watch: true

      flows:
        directory: /app/flows
        enabled: true
        watch: true

      runtime:
        max_concurrent_tasks: 10
        task_timeout_secs: 300
        max_tasks_per_user: 3

      decision_log:
        enabled: true
        path: /var/lib/aof/decisions.jsonl

      coordination:
        enabled: true
        mode: full
        heartbeat:
          frequency_secs: 60
          timeout_secs: 120
        token_limits:
          max_overhead_percent: 30.0
          auto_degrade: true
          recovery_threshold: 20.0
