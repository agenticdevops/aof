apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: aof-daemon
  namespace: aof-system
  labels:
    app.kubernetes.io/name: aof
    app.kubernetes.io/component: daemon
    app.kubernetes.io/part-of: aof-system
spec:
  serviceName: aof-daemon
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: aof
      app.kubernetes.io/component: daemon
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aof
        app.kubernetes.io/component: daemon
        app.kubernetes.io/part-of: aof-system
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: aof-daemon
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
      - name: aof
        image: aof:latest  # Replace with your image registry
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        env:
        - name: RUST_LOG
          value: "info,aofctl=info,aof_runtime=info"
        - name: AOF_CONFIG_DIR
          value: "/etc/aof"
        - name: AOF_DATA_DIR
          value: "/var/lib/aof"
        # API keys from secret
        - name: ANTHROPIC_API_KEY
          valueFrom:
            secretKeyRef:
              name: aof-secrets
              key: anthropic-api-key
              optional: true
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: aof-secrets
              key: openai-api-key
              optional: true
        # Messaging platform tokens
        - name: SLACK_BOT_TOKEN
          valueFrom:
            secretKeyRef:
              name: aof-secrets
              key: slack-bot-token
              optional: true
        - name: SLACK_SIGNING_SECRET
          valueFrom:
            secretKeyRef:
              name: aof-secrets
              key: slack-signing-secret
              optional: true
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "2000m"
        volumeMounts:
        - name: config
          mountPath: /etc/aof
          readOnly: true
        - name: data
          mountPath: /var/lib/aof
        - name: checkpoints
          mountPath: /app/checkpoints
        lifecycle:
          preStop:
            exec:
              command: ["/bin/sh", "-c", "sleep 10"]
      volumes:
      - name: config
        configMap:
          name: aof-config
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 10Gi
  - metadata:
      name: checkpoints
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 5Gi
