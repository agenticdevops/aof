apiVersion: aof.dev/v1
kind: Agent
metadata:
  name: quick-test
  namespace: default
spec:
  model: google:gemini-2.5-flash
  temperature: 0.5
  max_tokens: 1024
  instructions: |
    You are a helpful assistant for quick testing.
    Respond concisely and accurately to any question.
    Be friendly and informative.
  tools:
    - shell
  memory:
    type: InMemory
